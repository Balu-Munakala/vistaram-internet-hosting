<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube hosting demo · sample</title>
  <style>
    /* minimal, clean reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #f8f9fc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    /* main card / demo container */
    .demo-card {
      max-width: 860px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.25), 0 8px 20px -8px rgba(0, 0, 0, 0.15);
      padding: 2rem 2rem 1.8rem;
      transition: transform 0.2s ease;
    }

    /* header with title and "demo" badge */
    .demo-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }

    .demo-header h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1a1f2e;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .demo-header h1 span {
      background: #ff0033;
      color: white;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ff0033, #cc0022);
      box-shadow: 0 2px 6px rgba(255, 0, 51, 0.25);
    }

    .yt-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ff0033;
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 1.2rem;
      font-weight: bold;
      margin-right: 6px;
    }

    /* video wrapper – keeps responsive aspect ratio */
    .video-wrapper {
      position: relative;
      width: 100%;
      background: #0a0a0a;
      border-radius: 1.25rem;
      overflow: hidden;
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.5);
      margin-bottom: 1.5rem;
      aspect-ratio: 16 / 9;
    }

    /* make iframe fill the wrapper */
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* video meta / hosting demo hint */
    .video-info {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem 1.5rem;
      padding: 0.4rem 0.2rem 0;
      color: #2c313e;
    }

    .hosting-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #eef2f9;
      padding: 0.45rem 1rem;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      color: #1f2a44;
      border: 1px solid #d9e0ec;
    }

    .hosting-badge i {
      font-style: normal;
      background: #00a86b;
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.15rem 0.45rem;
      border-radius: 20px;
      letter-spacing: 0.3px;
    }

    .meta-actions {
      display: flex;
      gap: 8px;
      color: #5f6b7f;
      font-size: 0.9rem;
    }

    .meta-actions span {
      background: #f0f3fa;
      padding: 0.4rem 1rem;
      border-radius: 30px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* optional small note */
    .demo-note {
      margin-top: 1.2rem;
      font-size: 0.8rem;
      color: #7a8499;
      text-align: center;
      border-top: 1px solid #e9ecf3;
      padding-top: 1rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .demo-note code {
      background: #edf1f9;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #1e293b;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    /* responsiveness */
    @media (max-width: 550px) {
      .demo-card {
        padding: 1.25rem 1.25rem 1.5rem;
        border-radius: 1.5rem;
      }
      .demo-header h1 {
        font-size: 1.4rem;
      }
      .demo-header h1 span {
        font-size: 0.7rem;
        padding: 0.15rem 0.6rem;
      }
      .yt-icon {
        width: 26px;
        height: 26px;
        font-size: 0.9rem;
      }
      .hosting-badge {
        font-size: 0.75rem;
        padding: 0.35rem 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="demo-card">
    <!-- header -->
    <div class="demo-header">
      <h1>
        <span class="yt-icon">▶</span>
        YouTube hosting demo
        <span>sample</span>
      </h1>
      <!-- simple indicator: embedded player works -->
      <div class="hosting-badge">
        <i>LIVE</i> embed ready
      </div>
    </div>

    <!-- video player: YouTube embed (using a popular open / demo video) -->
    <div class="video-wrapper">
      <!-- 
        This is a standard YouTube iframe embed.
        The video ID is "dQw4w9WgXcQ" (a well-known demo), 
        but you can replace src with any YouTube video ID.
        Full hosting demo – the iframe loads directly from YouTube's servers.
      -->
      <iframe 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0&modestbranding=1&showinfo=0" 
        title="YouTube video player — hosting demo sample"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
        loading="lazy">
      </iframe>
    </div>

    <!-- meta row: shows this is a hosting demo, with fake counters & actions -->
    <div class="video-info">
      <div class="hosting-badge" style="background: #e3f2fd; border-color: #b8d8f0;">
        ⚡ hosted player · 1080p ready
      </div>
      <div class="meta-actions">
        <span>👁️ 1.2M views</span>
        <span>📅 2025</span>
        <span>👍 24K</span>
      </div>
    </div>

    <!-- small footnote showing this is a demo -->
    <div class="demo-note">
      <span>🔗 <code>iframe embed</code> · responsive aspect-ratio</span>
      <span>🎬 sample video ID: <code>dQw4w9WgXcQ</code></span>
      <span>📱 mobile friendly</span>
    </div>
  </div>
</body>
</html>
